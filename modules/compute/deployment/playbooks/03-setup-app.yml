---
- name: App Java 실행 환경 준비
  hosts: app
  become: true
  any_errors_fatal: true
  tasks:
    - name: Java 21 설치
      ansible.builtin.dnf:
        name: java-21-amazon-corretto-headless
        state: present

    - name: 애플리케이션 실행 계정 생성
      ansible.builtin.user:
        name: tier3app
        system: true
        create_home: false
        shell: /sbin/nologin

    - name: Spring Boot 배포 디렉터리 생성
      ansible.builtin.file:
        path: /opt/tier3-app
        state: directory
        owner: tier3app
        group: tier3app
        mode: '0755'

